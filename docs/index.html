window.BATCOMPUTER={
  matchWake, wakeGate, duplexHear, isEcho, _heard(text){ rt.finalText=String(text)+' '; rt.interim=''; commitUtterance(); },
  get db(){ return db; }, get events(){ return events; }, get vault(){ return vault; }, get trace(){ return trace; }, vaultUse:vaultAttach, vaultSync:vaultSyncNow, submit, logEvent, showModule,
  /** run a board tool directly, e.g. BATCOMPUTER.tool('create_project',{name:'X',tasks:['Do Y']}) */
  tool(name,args){ const o=makeOps({who:'CONSOLE',project:null,log:s=>logEvent(s.split(' ')[0],'')}); if(!o[name]) throw new Error('unknown tool'); return o[name](args||{}); },
  /** dispatch an agent by name: BATCOMPUTER.run('oracle','compare X and Y',{project:'P01'}) */
  run(agent,instruction,{project}={}){ const a=findAgent(agent); if(!a) throw new Error('unknown agent'); return startRun({agent:a,project:project?findProject(project):null,instruction}); },
  registerModule(id,fn){ VIEWS[id]=fn; const m=MODS.find(m=>m.id===id); if(m) m.stub=false; renderNav(); }
};
// unlock/warm the audio pipeline on the very first click or keypress, so browser autoplay policy
// never silently blocks the first neural-voice reply (a suspended AudioContext plays no sound at all)
const unlockAudio=()=>{ document.removeEventListener('pointerdown',unlockAudio); document.removeEventListener('keydown',unlockAudio); try{ audioCtx(); }catch{} };
document.addEventListener('pointerdown',unlockAudio,{once:true}); document.addEventListener('keydown',unlockAudio,{once:true});
setupRec();
fit(); tick(); setInterval(tick,1000); setInterval(tickTrace,250);
renderAll(); sizeDir();

/* ---------- dedicated per-window display ----------
   Open this same file with ?view=<module> to land straight on one module — handy for pinning a
   window to a second or third monitor (projects on one, agents on another, idea map on a third…).
   Add &kiosk=1 to also hide the controls (module nav, mic/stop row, directive line) for a clean,
   watch-only display; it still updates live through the cross-window sync above. */
(()=>{
  const qp=new URLSearchParams(location.search);
  const view=(qp.get('view')||'').toLowerCase();
  if(view&&(view==='overview'||MODS.some(m=>m.id===view))) showModule(view);
  if(qp.get('kiosk')==='1') document.body.classList.add('kiosk');
  if(qp.get('car')==='1'){
    document.body.classList.add('kiosk','car');
    const car=el('div',''); car.id='car'; const host=el('div','phhost'); host.id='phoneHost'; car.appendChild(host);
    const x=el('button','carx','EXIT_CAR_DISPLAY'); x.type='button'; x.onclick=()=>{ location.href=location.href.split('?')[0]; }; car.appendChild(x); document.body.appendChild(car);
    const fitCar=()=>{ host.style.width=Math.min(innerWidth*.96,(innerHeight*.94)*(1000/400))+'px'; mountPhone(host); };
    fitCar(); let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(fitCar,150); });
    try{ if('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{}); }catch{}
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ try{ navigator.wakeLock.request('screen').catch(()=>{}); }catch{} } });
  }
})();
const onHealthClick=e=>{ const b=e.target.closest('[data-k]'); if(!b) return; const k=b.dataset.k; if(k==='brain'){ if(hasKey()) pingBrain(); else openConfig('key'); } else if(k==='voice') openConfig(); else if(k==='mic') micToggle(); else if(k==='vault') showModule('vault'); else showModule('agents'); };
$('#health').addEventListener('click',onHealthClick); $('#health2').addEventListener('click',onHealthClick);
document.addEventListener('click',e=>{ const u=e.target.closest('.rcundo'); if(u){ revertFile(u.dataset.pid,u.dataset.fid); return; }
  const dm=e.target.closest('[data-dismiss]'); if(dm){ tkGone.add(dm.dataset.dismiss); renderAgentFloor(); return; }
  const hd=e.target.closest('.tk .tkr'); if(hd&&!e.target.closest('button')){ const id=hd.parentNode.dataset.tk; if(tkOpen.has(id)) tkOpen.delete(id); else tkOpen.add(id); renderAgentFloor(); return; }
  const b=e.target.closest('.rc [data-stop],.tk [data-stop]'); if(b){ if(b.dataset.stop==='turn') interrupt(); else stopRun(b.dataset.stop); } });
$('#trace').addEventListener('click',e=>{ const b=e.target.closest('[data-stop]'); if(b) stopRun(b.dataset.stop); });
setTimeout(pingBrain,1200);
if(synth){ synth.onvoiceschanged=()=>{ renderMeta(); }; try{ synth.cancel(); }catch{} }   // clears a stuck engine left over from a previous session — mostly a Chrome issue
vaultInit();
bootSince=db.lastSeen||0;
const markSeen=()=>{ db.lastSeen=Date.now(); try{ saveNow(); }catch{} };
document.addEventListener('visibilitychange',()=>{ if(document.hidden) markSeen(); }); window.addEventListener('beforeunload',markSeen);
setTimeout(autoVaultBackup,6000); setInterval(autoVaultBackup,300000);
if(db.projects.length&&db.cfg.lastBrief!==isoDay(Date.now())&&!document.body.classList.contains('kiosk')) setTimeout(()=>showBriefing(true),1200);
logEvent('BOOT_OK','MK-IV');
if(/[?&]handsfree=1/.test(location.search)&&!db.cfg.handsFree){ db.cfg.handsFree=true; if((db.cfg.assistantName||'').trim()) db.cfg.wakeRequired=true; save(); }
setTimeout(autoStartMic,900);
if(db.devices.length){ setTimeout(devicesRefreshAll,1500); }
setInterval(()=>{ if(db.devices.length&&!document.hidden) devicesRefreshAll(); },90000);
logEvent(SR?'STT_READY':'STT_ABSENT','');
logEvent(synth?'TTS_READY':'TTS_ABSENT','');
logEvent(hasKey()?'KEY_BOUND':'KEY_MISSING','');
if(!storageOK) logEvent('STORE_FAIL','');
refreshState();
requestAnimationFrame(frame);
if(!db.cfg.seenConfig) openConfig('key');
})();
</script>
</body>
</html>
