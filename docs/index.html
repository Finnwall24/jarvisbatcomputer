};

/* =====================================================================
   ## TRACE  (live timeline of the current turn + running agents)
   ===================================================================== */
/* ---- request tracker: every request (a direct ask, or a background agent) is one card with its real stage,
   step list, rounds, tokens, files and how it ended — so "is it working, and how far along" has one honest answer ---- */
const TRACK_MAX_TURN=24, TRACK_MAX_RUN=16, turnLog=[];
function turnBegin(text){
  const T={id:'turn'+uid(),kind:'chat',who:'BATCOMPUTER',label:String(text).replace(/\s+/g,' ').slice(0,140),started:Date.now(),ended:null,status:'running',stage:'SENDING',round:0,tools:[],tin:0,tout:0,files:[],lastSignal:Date.now()};
  turnLog.unshift(T); if(turnLog.length>10) turnLog.length=10; traceLater(); return T;
}
const turnToItem=T=>({id:T.id,kind:'chat',who:T.who,role:'YOUR_REQUEST',label:T.label,started:T.started,ended:T.ended,status:T.status,stage:T.stage,round:T.round,max:TRACK_MAX_TURN,tools:T.tools,tin:T.tin,tout:T.tout,refs:T.files.map(r=>({pid:r.pid,fileId:r.fid})),receipts:T.files,lastSignal:T.lastSignal,err:T.err,warn:T.status==='nochange'?T.err:undefined,stopId:'turn'});
function runToItem(r){
  const ag=db.agents.find(a=>a.id===r.agent), p=r.project?db.projects.find(x=>x.id===r.project):null, t=p&&r.task?p.tasks.find(x=>x.id===r.task):null, running=r.status==='running';
  const status=running?'running':r.status==='done'?(r.warn?'nochange':'done'):r.status==='failed'?'failed':'stopped';
  return {id:r.id,kind:'agent',who:r.name,role:ag?ag.role:'',proj:p,label:t?`${t.key} ${t.title}`:(r.instruction||'general work'),started:r.started,ended:r.ended,status,stage:running?(r.phase||'STARTING'):'',round:r.round||0,max:TRACK_MAX_RUN,tools:r.tools||[],tin:r.ltin||r.tin||0,tout:r.ltout||r.tout||0,refs:r.files||[],lastSignal:r.hb||r.started,err:r.err,warn:r.warn,out:r.out,stopId:r.id};
}
const tkOpen=new Set(), tkGone=new Set();
function trackItems(){
  const now=Date.now(), all=[...turnLog.map(turnToItem),...db.runs.slice(0,12).map(runToItem)];
  const keep=i=>{
    if(tkGone.has(i.id)) return false; if(i.status==='running') return true;
    if(!i.ended||i.status==='stopped') return false;
    if(i.status==='failed'||i.status==='nochange') return now-i.ended<1800000;   // a problem stays until you dismiss it
    return i.kind==='agent'&&now-i.ended<20000;                                  // a chat that finished is already in the transcript
  };
  return all.filter(keep).sort((a,b)=>(b.status==='running')-(a.status==='running')||b.started-a.started).slice(0,5);
}
const STATUS_TXT={running:'RUNNING',done:'\u2713 DONE',failed:'\u2717 FAILED',nochange:'\u26A0 NO_CHANGE',stopped:'\u25A0 STOPPED'};
function trackRow(i){
  const now=Date.now(), running=i.status==='running', stale=running&&now-i.lastSignal>25000, open=tkOpen.has(i.id);
  const okN=i.tools.filter(t=>t.state==='ok').length, errN=i.tools.filter(t=>t.state==='err').length, nFiles=(i.refs||[]).length;
  const badge=running?(stale?'NO_SIGNAL \u00B7 '+Math.round((now-i.lastSignal)/1000)+'s':(i.stage||'WORKING')):(STATUS_TXT[i.status]||'');
  const right=running?`<span class="tkt" data-at="${i.started}">${fmtDur(now-i.started)}</span><button class="xbtn sm warn" data-stop="${i.stopId}" type="button">STOP</button>`
    :`<span class="tkt">${fmtDur((i.ended||now)-i.started)}</span>${i.status!=='done'?`<button class="tkx" data-dismiss="${esc(i.id)}" type="button" aria-label="Dismiss">\u2715</button>`:''}`;
  const why=!running&&i.status==='failed'?'Failed'+(i.err?': '+String(i.err).slice(0,140):''):!running&&i.status==='nochange'?(i.warn||'It said it changed something, but no update actually ran.'):
    !running&&i.status==='done'?`${okN} tool${okN===1?'':'s'} ok \u00B7 ${nFiles} file${nFiles===1?'':'s'} saved`:'';
  const tl=i.tools.slice(-6).map(t=>`<span class="rtl ${t.state}" title="${esc(t.out||'')}">${t.state==='ok'?'\u2713':t.state==='err'?'\u2717':'\u22EF'} ${esc(String(t.n).toUpperCase())}${t.brief?' '+esc(String(t.brief).slice(0,26)):''}${t.t1?' \u00B7 '+fmtDur(t.t1-t.t0):''}${t.state==='err'&&t.out?' \u2014 '+esc(String(t.out).slice(0,60)):''}</span>`).join('');
  const detail=open?`<div class="tkd">${tl||'<span class="rtl">No tool calls yet.</span>'}<div class="rcsig">ROUND ${i.round||1} of at most ${i.max} \u00B7 ${(i.tin||i.tout)?`${i.tin}\u2192${i.tout} TOKENS`:'NO_TOKENS_YET'}${running?` \u00B7 LAST_SIGNAL <span data-sig="${i.lastSignal}">${Math.max(0,Math.round((now-i.lastSignal)/1000))}s ago</span>`:''}${errN?` \u00B7 ${errN} FAILED`:''}</div>${(i.refs&&i.refs.length)?fileChipsHTML(i.refs)+(i.receipts?receiptsHTML(i.receipts):''):''}</div>`:'';
  return `<div class="tk ${running?'live':i.status}${open?' open':''}" data-tk="${esc(i.id)}"><div class="tkr" title="Click for details"><i class="tkdot"></i><b class="tkn">${esc(i.who)}</b><span class="tkw">${esc(String(i.label).slice(0,90))}</span><span class="tkb ${running?'':i.status}">${esc(badge)}</span>${right}</div>${running?`<div class="rmeter" title="Round ${i.round||1} of at most ${i.max} \u2014 a ceiling, not a forecast"><i style="width:${Math.min(100,Math.round((i.round||1)/i.max*100))}%"></i></div>`:''}${why&&!open&&!running?`<div class="tko ${i.status}">${esc(why)}</div>`:''}${detail}</div>`;
}
const trace={steps:[],t0:0,speak:null,listen:null};
const fmtDur=ms=>ms<60000?(ms/1000).toFixed(1)+'s':Math.floor(ms/60000)+'m'+pad(Math.round(ms%60000/1000))+'s';
function tReset(){ trace.steps=[]; trace.t0=Date.now(); trace.speak=null; trace.listen=null; renderTrace(); }
function tStart(kind,label,detail=''){
  if(!trace.t0) trace.t0=Date.now();
  const s={kind,label,detail,at:Date.now(),state:'run'}; trace.steps.push(s); if(trace.steps.length>16) trace.steps.shift();
  renderTrace(); return s;
}
function tEnd(s,detail,state='ok'){ if(!s||s.end) return; s.end=Date.now(); s.state=state; if(detail!=null) s.detail=detail; renderTrace(); }
let trT=0, trPend=0;
function tDetail(s,d){ s.detail=d; const n=performance.now(); if(n-trT>180){ trT=n; renderTrace(); } }
function traceSpeakStart(){ trace.speak=tStart('SPEAK','SPEAKING',engineLabel()); }
function traceSpeakEnd(state='ok'){ if(trace.speak){ tEnd(trace.speak,null,state); trace.speak=null; } }
function toolBrief(n,a){
  a=a||{};
  const v=a.name||a.title||a.target||a.service||a.place||a.action||a.query||a.path||a.idea||a.view||(a.agent?a.agent+(a.project?' > '+a.project:''):'')||(Array.isArray(a.ideas)?a.ideas.length+' IDEAS':'')||String(a.fact||a.text||'').slice(0,30)||'';
  return String(v).slice(0,30);
}
function toolOutcome(n,r){
  if(r&&r.results) return r.results.length+' HITS'; if(r&&r.project) return String(r.project); if(r&&r.task) return String(r.task);
  if(r&&r.ideas) return r.ideas.length+' ADDED'; if(r&&r.path) return String(r.path).split('/').pop().slice(0,26); return 'OK';
}
function agentTail(run){
  const line=String(run.out||'').split('\n').map(s=>s.replace(/[#*`>_\-]+/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean).pop();
  return line||run.phase||(run.steps.length?run.steps[run.steps.length-1].s:'STARTING');
}
/* ---- the agent floor: every agent's current job, live ---- */
function agentFloorHTML(){
  const items=trackItems(); if(!items.length) return '';
  return `<div class="tks">${items.map(trackRow).join('')}</div>`;
}
function renderAgentFloor(){
  $$('[data-floor]').forEach(box=>{
    const h=agentFloorHTML({wide:box.dataset.floor==='wide'}); box.hidden=!h;
    if(box.__h!==h){ box.__h=h; box.innerHTML=h; }
  });
}
function renderTrace(){
  const box=$('#trace'); if(!box) return;
  const live=db.runs.filter(r=>r.status==='running'), steps=trace.steps, running=steps.some(s=>s.state==='run');
  const stick=box.scrollHeight-box.scrollTop-box.clientHeight<40;
  const endAt=steps.length?Math.max(...steps.map(s=>s.end||Date.now())):0;
  let h=`<div class="trh"><span>TRACE</span><span>${running?'<b class="lv">LIVE</b>':steps.length?'LAST_TURN '+fmtDur(endAt-(trace.t0||steps[0].at)):'STANDBY'}</span></div>`;
  if(steps.length){
    h+='<div class="trl">'+steps.map(s=>{
      const t=s.end?fmtDur(s.end-s.at):`<span data-at="${s.at}">${fmtDur(Date.now()-s.at)}</span>`;
      return `<div class="tr ${s.state}"><i class="g"></i><span class="tk">${esc(s.label)}</span><span class="tt">${t}</span><span class="td">${esc(s.detail||'')}</span></div>`;
    }).join('')+'</div>';
  }else if(!live.length) h+='<div class="trn">Nothing running. Each turn appears here step by step: listening, model, tool calls, speech, with timings.</div>';
  if(live.length){
    h+=`<div class="trh ag"><span>AGENTS_LIVE</span><span>${live.length}</span></div><div class="trl">`+live.map(r=>{
      const p=r.project?db.projects.find(x=>x.id===r.project):null;
      return `<div class="tr run ag"><i class="g"></i><span class="tk">${esc(r.name)}${p?' &gt; '+esc(p.key):''}</span><span class="tt"><span data-at="${r.started}">${fmtDur(Date.now()-r.started)}</span></span><button class="tstop" data-stop="${r.id}" title="Stop this agent">STOP</button><span class="td">${esc(agentTail(r).slice(0,80))}</span></div>`;
    }).join('')+'</div>';
  }
  box.innerHTML=h; if(stick) box.scrollTop=box.scrollHeight;
  renderAgentFloor(); renderWorkingChip();
}
function traceLater(){ if(trPend) return; trPend=setTimeout(()=>{ trPend=0; renderTrace(); },220); }
function tickTrace(){ $$('[data-at]').forEach(n=>{ n.textContent=fmtDur(Date.now()-(+n.dataset.at)); }); }

/* =====================================================================
   ## VAULT  (Obsidian: long-term memory, note search, and a mirror of the board)
   Uses the browser's folder access, so no plugin is needed. The assistant can
   READ any note but only WRITES inside <vault>/Batcomputer/. Nothing is deleted.
   ===================================================================== */
const BASE='Batcomputer', MEM_PATH=BASE+'/Memory.md', MK_S='<!-- batcomputer:start -->', MK_E='<!-- batcomputer:end -->';
const MEM_TEMPLATE='---\ntags: [batcomputer/memory]\n---\n# Batcomputer memory\n\nLoaded into the assistant on every request. Edit freely, and keep it short.\n\n## About the operator\n\n## Preferences\n\n## Remembered\n';
const vault={dir:null,name:'',status:window.showDirectoryPicker?'off':'unsupported',err:'',index:new Map(),indexed:0,scanning:false,lastScan:0,memory:'',memMtime:0,hash:new Map(),written:0,lastSync:0,syncT:null,syncing:false,syncErr:''};
const vaultOn=()=>vault.status==='ready'&&!!db.cfg.vaultMemory;
const isoDay=ts=>{ const d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const safeName=s=>String(s).replace(/[\\/:*?"<>|#^\[\]]+/g,' ').replace(/\s+/g,' ').trim().slice(0,70)||'Untitled';
const stripFm=t=>String(t).replace(/^---\n[\s\S]*?\n---\n?/,'');
const obsidianUrl=path=>'obsidian://open?vault='+encodeURIComponent(vault.name)+(path?'&file='+encodeURIComponent(path.replace(/\.md$/i,'')):'');
function vaultChanged(){ renderMeta(); renderNav(); scheduleRedraw(); }

/* ---- the folder handle survives reloads in IndexedDB ---- */
/* empties an IndexedDB store in place — used by WIPE_ALL_DATA. Deleting the whole database sounds cleaner,
   but indexedDB.deleteDatabase() silently stalls in 'blocked' until every open connection to it closes —
   and a just-used vault or files store often still has one lingering, which is exactly when this runs. A
   plain readwrite transaction has no such requirement, so clearing the store is what actually completes. */
function wipeIdbStore(dbName,storeName){
  return new Promise(res=>{
    let done=false; const finish=()=>{ if(!done){ done=true; res(); } };
    try{
      const req=indexedDB.open(dbName);
      req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains(storeName)) req.result.createObjectStore(storeName); };
      req.onsuccess=()=>{
        const d=req.result;
        try{
          if(!d.objectStoreNames.contains(storeName)){ d.close(); return finish(); }
          const tx=d.transaction(storeName,'readwrite'); tx.objectStore(storeName).clear();
          tx.oncomplete=()=>{ d.close(); finish(); }; tx.onerror=()=>{ d.close(); finish(); };
        }catch{ try{ d.close(); }catch{} finish(); }
      };
      req.onerror=finish;
      setTimeout(finish,800);
    }catch{ finish(); }
  });
}
const idb=()=>new Promise((res,rej)=>{ const r=indexedDB.open('batcomputer.vault',1); r.onupgradeneeded=()=>r.result.createObjectStore('h'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
async function idbGet(k){ try{ const d=await idb(); return await new Promise((res,rej)=>{ const q=d.transaction('h').objectStore('h').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch{ return null; } }
async function idbSet(k,v){ try{ const d=await idb(); await new Promise((res,rej)=>{ const t=d.transaction('h','readwrite'); t.objectStore('h').put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); return true; }catch{ return false; } }

async function vaultInit(){
  if(!window.showDirectoryPicker){ vault.status='unsupported'; vaultChanged(); return; }
  const h=await idbGet('dir'); if(!h){ vault.status='off'; vaultChanged(); return; }
  vault.dir=h; vault.name=h.name;
  let p='prompt'; try{ p=await h.queryPermission({mode:'readwrite'}); }catch{}
  if(p==='granted') await vaultStart(); else{ vault.status='locked'; vaultChanged(); }
}
async function vaultAttach(h){ vault.dir=h; vault.name=h.name; vault.index.clear(); vault.hash.clear(); await idbSet('dir',h); await vaultStart(); }
async function vaultConnect(){ const h=await window.showDirectoryPicker({mode:'readwrite',id:'batcomputer-vault'}); await vaultAttach(h); }
async function vaultUnlock(){ const p=await vault.dir.requestPermission({mode:'readwrite'}); if(p==='granted') await vaultStart(); else{ vault.err='Permission was not granted.'; vaultChanged(); } }
async function vaultForget(){ vault.dir=null; vault.name=''; vault.status=window.showDirectoryPicker?'off':'unsupported'; vault.index.clear(); vault.hash.clear(); vault.memory=''; await idbSet('dir',null); vaultChanged(); }
async function vaultStart(){
  vault.status='ready'; vault.err='';
  try{ await dirAt(BASE,true); await loadMemory(); }catch(e){ vault.err='Setup failed: '+e.message; }
  activity('Vault connected: '+vault.name); vaultChanged(); vaultScan(); vaultSchedule(true);
}

/* ---- file helpers (paths are always relative to the vault root) ---- */
const goodPath=parts=>parts.length&&parts.every(p=>p&&p!=='..'&&p!=='.'&&!p.startsWith('.'));
async function dirAt(path,create=false){ let d=vault.dir; for(const part of path.split('/').filter(Boolean)) d=await d.getDirectoryHandle(part,{create}); return d; }
async function vaultRead(path){
  const parts=String(path).replace(/^\/+/,'').split('/'); if(!goodPath(parts)) throw new Error('Invalid path.');
  const d=await dirAt(parts.slice(0,-1).join('/')); const f=await (await d.getFileHandle(parts.at(-1))).getFile();
  return {text:await f.text(),mtime:f.lastModified};
}
async function vaultWrite(path,text){
  if(vault.status!=='ready') throw new Error('The vault is not connected.');
  const parts=String(path).split('/'); if(parts[0]!==BASE||!goodPath(parts)) throw new Error('Writes are only allowed inside the '+BASE+' folder.');
  const d=await dirAt(parts.slice(0,-1).join('/'),true); const w=await (await d.getFileHandle(parts.at(-1),{create:true})).createWritable(); await w.write(text); await w.close();
}

/* ---- memory: one note that is loaded into every request ---- */
async function loadMemory(){
  try{ const r=await vaultRead(MEM_PATH); vault.memory=r.text; vault.memMtime=r.mtime; }
  catch(e){ if(e.name!=='NotFoundError') throw e; await vaultWrite(MEM_PATH,MEM_TEMPLATE); vault.memory=MEM_TEMPLATE; await refreshMemory(true); }
}
async function refreshMemory(force){
  if(vault.status!=='ready') return;
  try{ const d=await dirAt(BASE); const f=await (await d.getFileHandle('Memory.md')).getFile(); if(force||f.lastModified!==vault.memMtime){ vault.memory=await f.text(); vault.memMtime=f.lastModified; } }catch{}
}
function memText(){
  const t=stripFm(vault.memory).trim(); if(t.length<=4000) return t;
  return t.slice(0,2500)+'\n…\n'+t.slice(-1500);
}
async function vaultRemember(fact){
  const line='- '+isoDay(Date.now())+': '+String(fact).replace(/\s+/g,' ').trim().slice(0,300);
  let cur; try{ cur=(await vaultRead(MEM_PATH)).text; }catch(e){ if(e.name!=='NotFoundError') throw e; cur=MEM_TEMPLATE; }
  await vaultWrite(MEM_PATH,cur.replace(/\s*$/,'\n')+line+'\n'); await refreshMemory(true); return line;
}
async function vaultSaveNote(title,content,overwrite){
  const base=safeName(title); const d=await dirAt(BASE+'/Notes',true);
  const exists=async nm=>{ try{ await d.getFileHandle(nm); return true; }catch(e){ if(e.name==='NotFoundError') return false; throw e; } };
  let name=base, isUpdate=false;
  if(await exists(base+'.md')){
    if(overwrite===false){ let i=2; while(await exists((name=base+' '+i)+'.md')) i++; }
    else isUpdate=true;
  }
  const path=`${BASE}/Notes/${name}.md`;
  await vaultWrite(path,`---\ncreated: ${isoDay(Date.now())}\nsource: batcomputer\ntags: [batcomputer/note]\n---\n# ${title}\n\n${String(content).trim()}\n`);
  return {path,updated:isUpdate};
}

/* =====================================================================
   ## PROJECT FILES  (documents, generated visuals, attachments — per project)
   Stored in the Obsidian vault when one is connected, inside that project's own
   folder (Batcomputer/Projects/<key>/Files/) alongside its note and its ideas —
   otherwise in the browser's IndexedDB so the feature works either way.
   ===================================================================== */
const filesIdb=()=>new Promise((res,rej)=>{ const r=indexedDB.open('batcomputer.files',1); r.onupgradeneeded=()=>r.result.createObjectStore('blobs'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
async function idbPutBlob(key,blob){ const d=await filesIdb(); await new Promise((res,rej)=>{ const t=d.transaction('blobs','readwrite'); t.objectStore('blobs').put(blob,key); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function idbGetBlob(key){ const d=await filesIdb(); return new Promise((res,rej)=>{ const q=d.transaction('blobs').objectStore('blobs').get(key); q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error); }); }
async function idbDelBlob(key){ const d=await filesIdb(); await new Promise((res,rej)=>{ const t=d.transaction('blobs','readwrite'); t.objectStore('blobs').delete(key); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }

async function vaultWriteBinary(path,blob){
  if(vault.status!=='ready') throw new Error('The vault is not connected.');
  const parts=String(path).split('/'); if(parts[0]!==BASE||!goodPath(parts)) throw new Error('Writes are only allowed inside the '+BASE+' folder.');
  const d=await dirAt(parts.slice(0,-1).join('/'),true); const w=await (await d.getFileHandle(parts.at(-1),{create:true})).createWritable(); await w.write(blob); await w.close();
}
async function vaultReadBinary(path){
  const parts=String(path).replace(/^\/+/,'').split('/'); if(!goodPath(parts)) throw new Error('Invalid path.');
  const d=await dirAt(parts.slice(0,-1).join('/')); return (await (await d.getFileHandle(parts.at(-1))).getFile());
}

const FKIND_EXT={image:['png','jpg','jpeg','gif','webp','svg'],html:['html','htm'],markdown:['md','markdown'],text:['txt','json','csv','log','css','js']};
function fileKind(name,mime){
  if(mime&&mime.startsWith('image/')) return 'image';   // <img> renders svg fine, so it gets a real thumbnail + lightbox
  if(mime==='text/html') return 'html';
  const ext=(String(name).split('.').pop()||'').toLowerCase();
  for(const k in FKIND_EXT) if(FKIND_EXT[k].includes(ext)) return k;
  return 'other';
}
const MIME_BY_EXT={html:'text/html',htm:'text/html',svg:'image/svg+xml',md:'text/markdown',markdown:'text/markdown',txt:'text/plain',json:'application/json',csv:'text/csv',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',pdf:'application/pdf'};
const guessMime=name=>MIME_BY_EXT[(String(name).split('.').pop()||'').toLowerCase()]||'application/octet-stream';
const fmtBytes=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';

function projectFolder(p){ return `${BASE}/Projects/${p.key}`; }   // stable by key — survives a rename, everything about the project lives here
function projectFilesVaultBase(p,folder='Files'){ return `${projectFolder(p)}/${folder}`; }
/** create (or just register) a named subfolder under this project's vault folder, e.g. "Research", "Contracts" */
async function createProjectFolder(p,name){
  name=safeName(name); if(!name) throw new Error('Give the folder a name.');
  if(!p.folders) p.folders=[];
  if(name.toLowerCase()==='files'||p.folders.some(f=>f.toLowerCase()===name.toLowerCase())) return name;
  if(vault.status==='ready') await dirAt(`${projectFolder(p)}/${name}`,true);
  p.folders.push(name); p.updated=Date.now();
  return name;
}
function removeProjectFolder(p,name){ p.folders=(p.folders||[]).filter(f=>f!==name); p.updated=Date.now(); }   // untracks only — never deletes vault content
async function uniqueFileName(p,name,folder='Files'){
  const dot=name.lastIndexOf('.'), base=dot>0?name.slice(0,dot):name, ext=dot>0?name.slice(dot):'';
  let n=name,i=2;
  const taken=nm=>p.files.some(f=>f.name===nm&&(f.folder||'Files')===folder);
  if(vault.status==='ready'){
    const d=await dirAt(projectFilesVaultBase(p,folder),true);
    const exists=async nm=>{ try{ await d.getFileHandle(nm); return true; }catch(e){ if(e.name==='NotFoundError') return false; throw e; } };
    while(taken(n)||await exists(n)) n=`${base} ${i++}${ext}`;
  }else while(taken(n)) n=`${base} ${i++}${ext}`;
  return n;
}
/** content: a string (text/html/markdown) or a Blob (uploaded/binary). folder defaults to the project's main Files folder. */
async function saveProjectFile(p,name,content,{mime,src='OPERATOR',ts,folder='Files'}={}){
  name=safeName(name)||'file'; if(!/\.[a-z0-9]+$/i.test(name)) name+= typeof content==='string'?'.md':'.bin';
  name=await uniqueFileName(p,name,folder);
  const isBlob=content instanceof Blob;
  const blob=isBlob?content:new Blob([content],{type:mime||guessMime(name)});
  mime=blob.type||mime||guessMime(name);
  const meta={id:uid(),name,mime,kind:fileKind(name,mime),size:blob.size,ts:ts||Date.now(),src,store:'idb',folder,rev:1,by:src};
  if(vault.status==='ready'){
    try{ await vaultWriteBinary(`${projectFilesVaultBase(p,folder)}/${name}`,blob); meta.store='vault'; meta.path=`${projectFilesVaultBase(p,folder)}/${name}`; }
    catch(e){ meta.store='idb'; }
  }
  if(meta.store==='idb') await idbPutBlob(meta.id,blob);
  p.files.unshift(meta); if(p.files.length>200) p.files.length=200; p.updated=Date.now();
  return meta;
}
const AUTO_FOLDER={markdown:'Documents',text:'Documents',html:'Pages',image:'Images'};
/** move a file to another project and/or subfolder (vault files are physically moved; browser-stored ones just re-filed) */
async function moveProjectFile(fromP,meta,toP,toFolder='Files'){
  toFolder=toFolder||'Files';
  if(fromP===toP&&(meta.folder||'Files')===toFolder) return;
  if(toFolder!=='Files') await createProjectFolder(toP,toFolder);
  const name=await uniqueFileName(toP,meta.name,toFolder);
  if(meta.store==='vault'){
    const blob=await vaultReadBinary(meta.path); const newPath=`${projectFilesVaultBase(toP,toFolder)}/${name}`;
    await vaultWriteBinary(newPath,blob);
    try{ const parts=meta.path.split('/'); const d=await dirAt(parts.slice(0,-1).join('/')); await d.removeEntry(parts.at(-1)); }catch{}
    meta.path=newPath;
  }
  meta.name=name; meta.folder=toFolder;
  if(fromP!==toP){ fromP.files=fromP.files.filter(f=>f.id!==meta.id); toP.files.unshift(meta); }
  fromP.updated=toP.updated=Date.now();
}
/** sort everything sitting in a project's main Files folder into Documents / Pages / Images */
async function tidyProjectFiles(p){
  let n=0;
  for(const m of [...p.files]){ const f=AUTO_FOLDER[m.kind]; if(f&&(m.folder||'Files')==='Files'){ try{ await moveProjectFile(p,m,p,f); n++; }catch(e){ activity('Could not move '+m.name+': '+e.message,true); } } }
  activity(n?`Tidied ${n} file${n>1?'s':''} in ${p.key}`:`${p.key} is already tidy`); return n;
}
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
/** minimal store-only .zip writer — no library needed, opens everywhere */
async function makeZip(entries){
  const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
  const d=new Date(), dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const e of entries){
    const data=new Uint8Array(await e.blob.arrayBuffer()), name=enc.encode(e.name), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true); lh.setUint16(10,dt,true); lh.setUint16(12,dd,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(lh.buffer,name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,dt,true); ch.setUint16(14,dd,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true); ch.setUint32(42,offset,true);
    central.push(ch.buffer,name); offset+=30+name.length+data.length;
  }
  const cdSize=central.reduce((n,b)=>n+b.byteLength,0), end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,entries.length,true); end.setUint16(10,entries.length,true); end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
  return new Blob([...parts,...central,end.buffer],{type:'application/zip'});
}
async function zipFiles(items){
  const entries=[]; for(const {p,m} of items){ entries.push({name:`${p.key} ${safeName(p.name)}/${m.folder||'Files'}/${m.name}`,blob:await readProjectFile(m)}); }
  download('batcomputer_files_'+new Date().toISOString().slice(0,10)+'.zip',await makeZip(entries),'application/zip');
}
async function readProjectFile(meta){
  if(meta.store==='vault') return vaultReadBinary(meta.path);
  const b=await idbGetBlob(meta.id); if(!b) throw new Error('That file is no longer available.'); return b;
}
async function deleteProjectFile(p,meta){ p.files=p.files.filter(f=>f.id!==meta.id); await physicalDeleteFile(meta); }
async function physicalDeleteFile(meta){
  (meta.versions||[]).forEach(v=>idbDelBlob(v.key).catch(()=>{}));
  if(meta.store==='vault'){ try{ const parts=meta.path.split('/'); const d=await dirAt(parts.slice(0,-1).join('/')); await d.removeEntry(parts.at(-1)); }catch{} }
  else{ try{ await idbDelBlob(meta.id); }catch{} }
}
function fileObjectUrl(blob){ return URL.createObjectURL(blob); }
/* ---- apps it builds: an HTML page opened in the viewer can really DO things through a small allowlisted bridge.
   The page runs sandboxed (no access to this app's data or tokens); it asks over postMessage, this side runs the
   request with the same tools the assistant has (lights, gadgets, weather) and hands back only the result. It can
   never write files, read services, or touch keys. window.batcomputer.* is injected into every HTML file viewed. ---- */
const APP_TOOLS=new Set(['list_devices','control_lights','device_action','get_weather']);
const appWins=new Map();   // contentWindow -> {fileId, calls:[timestamps]}
const APP_SDK=`<script>(function(){var n=0,p={};window.addEventListener('message',function(e){var d=e.data;if(d&&d.bc==='res'&&p[d.id]){var q=p[d.id];delete p[d.id];d.ok?q.res(d.data):q.rej(new Error(d.error||'failed'));}});
function send(op,x){return new Promise(function(res,rej){var id=++n;p[id]={res:res,rej:rej};parent.postMessage(Object.assign({bc:'req',id:id,op:op},x),'*');setTimeout(function(){if(p[id]){delete p[id];rej(new Error('timed out'));}},30000);});}
var B={call:function(tool,args){return send('call',{tool:tool,args:args||{}});},
devices:function(){return B.call('list_devices').then(function(r){return (r&&r.devices)||[];});},lights:function(a){return B.call('control_lights',a);},device:function(a){return B.call('device_action',a);},weather:function(place,units){return B.call('get_weather',{place:place,units:units});},
store:{get:function(k){return send('store_get',{key:k});},set:function(k,v){return send('store_set',{key:k,value:v});}}};window.batcomputer=B;})();<\/script>`;
const withAppSdk=html=>{ const m=/<head[^>]*>/i.exec(html); return m?html.slice(0,m.index+m[0].length)+APP_SDK+html.slice(m.index+m[0].length):APP_SDK+html; };
window.addEventListener('message',async e=>{
  const d=e.data, w=appWins.get(e.source); if(!w||!d||d.bc!=='req') return;
  const reply=r=>{ try{ e.source.postMessage({bc:'res',id:d.id,...r},'*'); }catch{} };
  const now=Date.now(); w.calls=w.calls.filter(t=>now-t<10000); if(w.calls.length>=40) return reply({ok:false,error:'Too many requests too fast — slow down (40 per 10 seconds).'}); w.calls.push(now);
  try{
    if(d.op==='call'){
      if(!APP_TOOLS.has(d.tool)) throw new Error(`Apps can use: ${[...APP_TOOLS].join(', ')}.`);
      const ops=makeOps({who:'APP',project:null,log:s=>logEvent(s.split(' ')[0],'')});
      reply({ok:true,data:await ops[d.tool](d.args&&typeof d.args==='object'?d.args:{})});
    }else if(d.op==='store_get'){ reply({ok:true,data:((db.appData[w.fileId]||{})[String(d.key)])??null}); }
    else if(d.op==='store_set'){
      const box=db.appData[w.fileId]||(db.appData[w.fileId]={}); box[String(d.key).slice(0,80)]=d.value;
      if(JSON.stringify(box).length>200000){ delete box[String(d.key).slice(0,80)]; throw new Error('This app has stored too much (200 KB limit).'); }
      save(); reply({ok:true,data:true});
    }else throw new Error('Unknown request.');
  }catch(err){ reply({ok:false,error:String(err&&err.message||err)}); }
});
/** puts a file's rendered content into `body` (a document, page or image) — shared by the overlay and the display tab */
/** how a page it built is shown: a window-style frame (title, version, FIT / TABLET / PHONE width, RELOAD) around the sandboxed page */
function htmlFrame(body,{html,title,sub,fileId,chrome=true}){
  const doc=withAppSdk(html), reg=()=>{ const fr=body.querySelector('iframe'); if(fr&&fr.contentWindow) appWins.set(fr.contentWindow,{fileId,calls:[]}); };
  if(!chrome){ body.innerHTML=`<iframe sandbox="allow-scripts" srcdoc="${esc(doc)}"></iframe>`; reg(); return; }
  body.innerHTML=`<div class="hframe"><div class="hfbar"><span class="hfd"><i></i><i></i><i></i></span><span class="hft">${esc(title)}</span><span class="hfv">${esc(sub||'')}</span><span class="hfs"></span></div><div class="hfstage"><iframe sandbox="allow-scripts" srcdoc="${esc(doc)}"></iframe></div></div>`;
  reg(); const fr=body.querySelector('iframe'), sz=body.querySelector('.hfs');
  const set=w=>{ fr.style.width=w||'100%'; sz.querySelectorAll('button[data-w]').forEach(b=>b.classList.toggle('on',b.dataset.w===(w||''))); };
  [['FIT',''],['TABLET','820px'],['PHONE','390px']].forEach(([t,w])=>{ const b=el('button','hfb',t); b.type='button'; b.dataset.w=w; b.onclick=()=>set(w); sz.appendChild(b); });
  const rl=el('button','hfb','RELOAD'); rl.type='button'; rl.onclick=()=>{ fr.srcdoc=doc; }; sz.appendChild(rl); set('');
}
async function fillFileBody(body,p,meta,opts={}){
  let url=null;
  try{

function matchFiles(query,{project=null}={}){
  const raw=String(query||'').replace(/\.(html?|md|markdown|txt|svg|png|jpe?g|gif|webp|pdf|csv|json|css|js|docx?|xlsx?|pptx?)\b/gi,' '), toks=words(raw).filter(w=>!FILE_NOISE.has(w)), kinds=new Set(), nameToks=[];

  const hits=[];

    const pt=words(p.name+' '+p.key);
    p.files.forEach(m=>{
      const nt=words(m.name.replace(/\.[a-z0-9]+$/i,'')); let score=0, nameHit=0;
      for(const w of nameToks){ if(nt.some(x=>sameWord(w,x))){ score+=3; nameHit++; } else if(pt.some(x=>sameWord(w,x))) score+=1; else return; }
      if(kinds.size){ if(kinds.has(m.kind)) score+=2; else if(!nameToks.length) return; }

async function vaultScan(){
  if(vault.status!=='ready'||vault.scanning) return; vault.scanning=true; vault.indexed=0; const seen=new Set();

      if(h.kind==='directory'){ await walk(h,prefix+name+'/'); continue; }
      if(!/\.md$/i.test(name)) continue;
      const path=prefix+name; seen.add(path);
      const f=await h.getFile(), old=vault.index.get(path);
      if(!old||old.mtime!==f.lastModified) vault.index.set(path,{path,name:name.replace(/\.md$/i,''),mtime:f.lastModified,lower:f.size>2e6?'':(await f.text()).slice(0,60000).toLowerCase()});

}

function vaultSearch(q,limit=5){

const BUILTIN_APPS=[

VIEWS.apps=box=>{
  redraw=draw; draw();
  function draw(){
    const r=ui.appRun;
    if(r&&r.builtin){ if(box.dataset.run==='b:'+r.builtin&&box.querySelector('.apprun *')) return; return drawBuiltin(r.builtin); }
    const run=r&&locateFile(r.pid,r.fid);
    if(run&&run.m.app){ if(box.dataset.run===run.m.id&&box.querySelector('iframe')) return; return drawRun(run.p,run.m); }   // never rebuild a running app just because something else changed
    ui.appRun=null; delete box.dataset.run; drawGrid();
  }
  function tile(g,{icon,title,sub,go,tag}){
    const t=el('button','apptile',`<i>${esc(icon)}</i><b>${esc(title)}</b><span>${esc(sub)}</span>${tag?`<em>${esc(tag)}</em>`:''}`); t.type='button'; t.onclick=go; g.appendChild(t);
  }
  function drawGrid(){
    box.innerHTML='';
    const list=appsList();
    box.appendChild(el('div','mh',`<span>APPS / ${BUILTIN_APPS.length+list.length}</span><span>RUN_INSIDE_THE_CONSOLE</span>`));
    box.appendChild(el('div','sect','<span>BUILT_IN</span><small>part of the console · click to run it right here</small>'));
    const g=el('div','apptiles'); box.appendChild(g);
    BUILTIN_APPS.forEach(a=>tile(g,{icon:a.icon,title:a.title,sub:a.sub,tag:a.launch?'OPENS_A_WINDOW':'',go:()=>{ if(a.launch){ openCarDisplay(); return; } ui.appRun={builtin:a.id}; draw(); }}));
    box.appendChild(el('div','sect',`<span>YOUR_APPS</span><small>pages it built for you · ask: "Hey ${esc((db.cfg.assistantName||'Nova').trim()||'Nova')}, build me a … and add it to my apps"</small>`));
    const g2=el('div','apptiles'); box.appendChild(g2);
    list.forEach(({p,m})=>tile(g2,{icon:(m.app.title||'?').trim().charAt(0).toUpperCase(),title:m.app.title,sub:`${p.key} · v${m.rev||1}`,go:()=>{ ui.appRun={pid:p.id,fid:m.id}; draw(); }}));
    if(!list.length) g2.appendChild(el('div','allclr','<b>NOTHING_HERE_YET</b>Anything it builds and you pin appears here.'));
    const loose=db.projects.flatMap(p=>p.files.filter(m=>m.kind==='html'&&!m.app).map(m=>({p,m})));
    if(loose.length){ box.appendChild(el('div','sect','<span>PIN_A_PAGE</span><small>web pages you already have · click one to make it an app</small>')); const c=el('div','wfiles'); loose.slice(0,24).forEach(({p,m})=>{ const b=el('button','fchip',esc(m.name)); b.type='button'; b.onclick=()=>{ m.app={title:m.name.replace(/\.[a-z0-9]+$/i,'').slice(0,30)}; changed(true); }; c.appendChild(b); }); box.appendChild(c); }
  }
  function shell(title,key,extra){
    box.innerHTML=''; box.dataset.run=key;
    const bar=el('div','appbar'), btn=(t,fn,cls='')=>{ const b=el('button','xbtn sm '+cls,t); b.type='button'; b.onclick=fn; bar.appendChild(b); return b; };
    btn('< ALL_APPS',()=>{ ui.appRun=null; draw(); }); bar.appendChild(el('span','appt',esc(title)));
    const body=el('div','apprun'); extra&&extra(btn,body); box.appendChild(bar); box.appendChild(body); return body;
  }
  function drawBuiltin(id){
    const key='b:'+id;
    if(id==='home'){ const body=shell('HOME_CONTROL',key,(btn,body)=>{ btn('RELOAD',()=>{ delete box.dataset.run; draw(); }); btn('FULL_SCREEN',()=>{ try{ body.requestFullscreen(); }catch{} }); }); htmlFrame(body,{html:STARTER_HOME,title:'Home Control',sub:'BUILT_IN',fileId:'builtin:home'}); }
    else if(id==='phone'){ const body=shell('PHONE',key); body.classList.add('apphost'); phoneScreen(body); }
  }
  async function drawRun(p,m){
    const body=shell(m.app.title,m.id,(btn,body)=>{
      btn('RELOAD',()=>{ delete box.dataset.run; draw(); }); btn('FULL_SCREEN',()=>{ try{ body.requestFullscreen(); }catch{} });
      btn('EDIT',()=>editProjectFile(p,m).catch(e=>activity('Could not open '+m.name+': '+e.message,true)));

    });
    await fillFileBody(body,p,m);
  }
};

VIEWS.wall=box=>{

    if(rt.activeModule!=='wall'){ clearInterval(box.__wallT); return; }
    draw();
    if(++n%4===0&&db.devices.some(d=>d.kind==='hue')) devicesRefreshAll().then(()=>{ if(rt.activeModule==='wall') draw(); }).catch(()=>{});   // keep the lights current (~every 16s)
  },4000);
  if(db.devices.some(d=>d.kind==='hue')) devicesRefreshAll().then(()=>{ if(rt.activeModule==='wall') draw(); }).catch(()=>{});
  const ops=makeOps({who:'DASHBOARD',project:null,log:s=>logEvent(s.split(' ')[0],'')});
  const goProject=p=>{ ui.project=p.id; showModule('projects'); };
  function draw(){
    const keep=box.scrollTop; box.innerHTML='';
    const live=db.runs.filter(r=>r.status==='running'), att=attention(), open=db.projects.filter(p=>p.status!=='DONE');
    const files=db.projects.reduce((n,p)=>n+p.files.length,0), st=STATES[computeState()];
    const hues=db.devices.filter(d=>d.kind==='hue'), lights=hues.flatMap(d=>d.cache?d.cache.lights:[]), lightsOn=lights.filter(l=>l.on&&l.reachable!==false).length;
    box.appendChild(el('div','wintro','<b>DASHBOARD</b> · everything that is going on, on one screen. It refreshes by itself, and every card is a shortcut — click it to open that thing. Made for a second monitor or a TV: on the SCREENS tab, give a screen the job DASHBOARD.'));
    const tile=(label,val,sub,go,cls='')=>{ const b=el('button','wt wclick '+cls,`<b>${val}</b><span>${label}</span><i>${sub}</i>`); b.type='button'; b.onclick=go; return b; };
    const tiles=el('div','wtiles');
    tiles.appendChild(el('div','wt state',`<b style="color:${st[1]}">${st[0]}</b><span>RIGHT_NOW</span><i>what the assistant is doing</i>`));
    tiles.appendChild(tile('WORKING',pad(live.length),live.length?'agents busy for you':'nobody busy',()=>showModule('agents'),live.length?'hot':''));
    tiles.appendChild(tile('NEEDS_YOU',pad(att.length),att.length?'decisions waiting':'all clear',()=>showModule('overview'),att.length?'cool':''));
    tiles.appendChild(tile('PROJECTS',pad(open.length),'open · click to see',()=>{ ui.project=null; showModule('projects'); }));
    tiles.appendChild(tile('FILES',pad(files),'documents and pages',()=>showModule('files')));
    tiles.appendChild(tile('LIGHTS_ON',hues.length?pad(lightsOn)+'/'+pad(lights.length):'--',hues.length?'click to manage':'not connected yet',()=>showModule('devices')));

    if(!att.length) nl.appendChild(el('div','allclr','<b>ALL_CLEAR</b>Nothing is waiting on you.'));
    att.slice(0,8).forEach(it=>{
      const p=it.p||(it.r&&it.r.project?db.projects.find(x=>x.id===it.r.project):null);
      const title=it.k==='code'?it.r.prompt:it.k==='fail'?`${it.r.name}: ${it.r.err||'failed'}`:it.t?it.t.title:it.k==='empty'?`${it.p.name} has no tasks yet`:it.p?`${it.p.name} has gone quiet`:'Needs a look';

/* =====================================================================
   ## VIEW: IMAGINE  (a place to visualize an idea, described in words — no audio involved)
   ===================================================================== */

/* ---- IMAGINE: a tiny scene described in words ("a ball that bounces", "five gold stars orbiting, glowing") ----
   Parsed entirely locally (no API call) into a small set of shapes + one motion behaviour + visual modifiers,
   then simulated as a real physics scene, not a canned clip — so any combination of words produces something live. */
const IMG_COLOR={red:'#ff5a5a',orange:'#ff8a3c',amber:'#e0921f',gold:'#e0921f',yellow:'#ffd93c',green:'#7ec98f',teal:'#58b4c7',cyan:'#58d6e8',blue:'#6ea6e8',indigo:'#7a86e8',purple:'#a98bd0',violet:'#a98bd0',pink:'#ff8fc0',magenta:'#ff5ac8',white:'#f2ede0',silver:'#cfd6d8',black:'#2a2a2a',rainbow:null};
const IMG_SHAPE={ball:'circle',balls:'circle',circle:'circle',circles:'circle',sphere:'circle',spheres:'circle',orb:'circle',orbs:'circle',dot:'circle',dots:'circle',square:'square',squares:'square',box:'square',boxes:'square',cube:'square',cubes:'square',block:'square',blocks:'square',star:'star',stars:'star',triangle:'triangle',triangles:'triangle',line:'line',lines:'line',particle:'circle',particles:'circle'};
const IMG_MOTION={bounce:'bounce',bounces:'bounce',bouncing:'bounce',bouncy:'bounce',orbit:'orbit',orbits:'orbit',orbiting:'orbit',circling:'orbit',float:'float',floats:'float',floating:'float',drift:'float',drifts:'float',drifting:'float',hover:'float',hovers:'float',hovering:'float',spin:'spin',spins:'spin',spinning:'spin',rotate:'spin',rotates:'spin',rotating:'spin',pulse:'pulse',pulses:'pulse',pulsing:'pulse',beat:'pulse',beats:'pulse',beating:'pulse',throb:'pulse',throbs:'pulse',throbbing:'pulse',explode:'explode',explodes:'explode',exploding:'explode',burst:'explode',bursts:'explode',bursting:'explode',fall:'gravity',falls:'gravity',falling:'gravity',drop:'gravity',drops:'gravity',dropping:'gravity',gravity:'gravity',wave:'wave',waves:'wave',waving:'wave',ripple:'wave',ripples:'wave',rippling:'wave',spiral:'spiral',spirals:'spiral',spiraling:'spiral',spiralling:'spiral',chase:'chase',chases:'chase',chasing:'chase',follow:'chase',follows:'chase',following:'chase',swarm:'swarm',swarms:'swarm',swarming:'swarm'};
const IMG_NUM={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,twelve:12,fifteen:15,twenty:20,dozen:12};
function parseImagine(text){
  const toks=String(text||'').toLowerCase().split(/[^a-z]+/).filter(Boolean);
  let shape='circle',motion='float',count=1,color=null,glow=false,trail=false,sparkle=false,sizeMul=1,speedMul=1,numGiven=false;
  const m=/\d+/.exec(text); if(m){ count=clamp(+m[0],1,80); numGiven=true; }
  toks.forEach(w=>{
    if(IMG_SHAPE[w]) shape=IMG_SHAPE[w];
    if(IMG_MOTION[w]) motion=IMG_MOTION[w];
    if(IMG_COLOR[w]!==undefined) color=IMG_COLOR[w];
    if(IMG_NUM[w]){ count=IMG_NUM[w]; numGiven=true; }
    if(!numGiven&&/^(many|lots|tons|dozens|crowd|swarm)$/.test(w)){ count=30; numGiven=true; }
    if(!numGiven&&/^(few|couple|some)$/.test(w)){ count=5; numGiven=true; }
    if(!numGiven&&/^(balls|circles|stars|squares|boxes|particles|dots|orbs|triangles|lines|cubes|blocks|spheres)$/.test(w)){ count=8; numGiven=true; }
    if(/^(glow|glowing|shiny|shining|bright|neon|luminous)$/.test(w)) glow=true;
    if(/^(trail|trailing|streak|streaking|comet)$/.test(w)) trail=true;
    if(/^(sparkle|sparkling|twinkle|twinkling|glitter)$/.test(w)) sparkle=true;
    if(/^(big|large|giant|huge|massive)$/.test(w)) sizeMul=1.8;
    if(/^(small|tiny|little|mini)$/.test(w)) sizeMul=.5;
    if(/^(fast|quick|quickly|speedy|rapid)$/.test(w)) speedMul=1.9;
    if(/^(slow|slowly|gentle|gently|lazy)$/.test(w)) speedMul=.5;
  });
  if(motion==='swarm'){ motion='float'; count=Math.max(count,18); }
  return {shape,motion,count,color,glow,trail,sparkle,sizeMul,speedMul,label:String(text||'').trim().slice(0,60)};
}
function spawnScene(cfg,W,H){
  const rnd=(a,b)=>a+Math.random()*(b-a), objs=[];
  for(let i=0;i<cfg.count;i++){
    const size=(cfg.shape==='line'?rnd(30,70):rnd(10,20))*cfg.sizeMul*(W<400?.6:1);
    objs.push({
      x:rnd(size,W-size)||W/2, y:cfg.motion==='gravity'?rnd(-H,0):rnd(size,H-size)||H/2,
      vx:rnd(-1,1)*60*cfg.speedMul, vy:rnd(-1,1)*60*cfg.speedMul,
      size, baseSize:size, angle:rnd(0,Math.PI*2), spin:rnd(-1,1)*(cfg.motion==='spin'?2.4:.6),
      color:cfg.color||(i%2?'#58b4c7':'#e0921f'), phase:rnd(0,Math.PI*2),
      orbitR:rnd(Math.min(W,H)*.12,Math.min(W,H)*.42), orbitA:rnd(0,Math.PI*2), orbitSpd:rnd(.3,.9)*(Math.random()<.5?-1:1)*cfg.speedMul,
      waveIdx:i, born:0, life:rnd(1.6,2.6),
    });
  }
  return objs;
}
function stepScene(objs,cfg,W,H,dt,now){
  const cx=W/2, cy=H/2, G=520*cfg.speedMul;
  objs.forEach((o,i)=>{
    o.angle+=o.spin*dt;
    if(cfg.motion==='bounce'){
      o.vy+=G*.55*dt; o.x+=o.vx*dt; o.y+=o.vy*dt;
      if(o.x<o.size){ o.x=o.size; o.vx=Math.abs(o.vx); } if(o.x>W-o.size){ o.x=W-o.size; o.vx=-Math.abs(o.vx); }
      if(o.y<o.size){ o.y=o.size; o.vy=Math.abs(o.vy)*.9; } if(o.y>H-o.size){ o.y=H-o.size; o.vy=-Math.abs(o.vy)*.86; }
    }else if(cfg.motion==='gravity'){
      o.vy+=G*dt; o.x+=o.vx*dt; o.y+=o.vy*dt;
      if(o.x<o.size||o.x>W-o.size) o.vx*=-1;
      if(o.y>H+o.size*2){ o.y=-o.size*2; o.x=Math.random()*W; o.vy=0; o.vx=(Math.random()-.5)*60*cfg.speedMul; }
    }else if(cfg.motion==='orbit'||cfg.motion==='spiral'){
      o.orbitA+=o.orbitSpd*dt*(cfg.motion==='spiral'?1.4:1);
      if(cfg.motion==='spiral'){ o.orbitR+=Math.sin(now/900+o.phase)*22*dt; o.orbitR=clamp(o.orbitR,Math.min(W,H)*.05,Math.min(W,H)*.46); }
      o.x=cx+Math.cos(o.orbitA)*o.orbitR; o.y=cy+Math.sin(o.orbitA)*o.orbitR*.72;
    }else if(cfg.motion==='wave'){
      o.x+=40*cfg.speedMul*dt; if(o.x>W+o.size) o.x=-o.size;
      o.y=cy+Math.sin(o.x/W*Math.PI*2*1.4+now/650+o.waveIdx*.6)*H*.3;
    }else if(cfg.motion==='chase'){
      const ahead=objs[i===0?objs.length-1:i-1]; const dx=ahead.x-o.x, dy=ahead.y-o.y, d=Math.hypot(dx,dy)||1;
      if(d>o.size*2.4){ o.vx+=(dx/d)*90*cfg.speedMul*dt; o.vy+=(dy/d)*90*cfg.speedMul*dt; } o.vx*=.985; o.vy*=.985;
      o.x+=o.vx*dt; o.y+=o.vy*dt; o.x=clamp(o.x,o.size,W-o.size); o.y=clamp(o.y,o.size,H-o.size);
    }else if(cfg.motion==='explode'){
      o.born+=dt; if(o.born>o.life){ o.born=0; o.x=cx; o.y=cy; const a=Math.random()*Math.PI*2,sp=rndSpeed(cfg); o.vx=Math.cos(a)*sp; o.vy=Math.sin(a)*sp; }
      o.x+=o.vx*dt; o.y+=o.vy*dt; o.vx*=.99; o.vy*=.99;
    }else{   // float — a slow, organic drift that never leaves the frame
      o.x+=Math.sin(now/1400+o.phase)*36*cfg.speedMul*dt+o.vx*dt*.2;
      o.y+=Math.cos(now/1700+o.phase*1.3)*30*cfg.speedMul*dt+o.vy*dt*.2;
      o.x=clamp(o.x,o.size,W-o.size); o.y=clamp(o.y,o.size,H-o.size);
    }
    if(cfg.motion==='pulse'||true) o.size=o.baseSize*(cfg.motion==='pulse'?1+.35*Math.sin(now/420+o.phase):1);
  });
}
function rndSpeed(cfg){ return (80+Math.random()*140)*cfg.speedMul; }
function drawShape(c,shape,x,y,size,angle,color,glow){
  c.save(); c.translate(x,y); c.rotate(angle);
  c.fillStyle=color; c.strokeStyle=color;
  if(glow){ c.shadowColor=color; c.shadowBlur=size*1.4; }

  else if(shape==='square'){ c.fillRect(-size,-size,size*2,size*2); }
  else if(shape==='triangle'){ c.beginPath(); c.moveTo(0,-size); c.lineTo(size*.87,size*.6); c.lineTo(-size*.87,size*.6); c.closePath(); c.fill(); }
  else if(shape==='line'){ c.lineWidth=Math.max(2,size*.22); c.beginPath(); c.moveTo(-size,0); c.lineTo(size,0); c.stroke(); }
  else{   // star
    c.beginPath(); for(let k=0;k<10;k++){ const r=k%2?size*.45:size, a=k/10*Math.PI*2-Math.PI/2; const px=Math.cos(a)*r, py=Math.sin(a)*r; k?c.lineTo(px,py):c.moveTo(px,py); } c.closePath(); c.fill();
  }

}
function drawScene(c,W,H,dt,now,objs,cfg){
  c.fillStyle=cfg.trail?'rgba(5,4,3,.22)':'#050403'; c.fillRect(0,0,W,H);

  // not for a swarm of 30+, where it alone was enough to visibly drop frame rate
  const glow=cfg.glow&&objs.length<=20;
  objs.forEach(o=>{
    drawShape(c,cfg.shape,o.x,o.y,o.size,o.angle,o.color,glow);

  });
  c.shadowBlur=0;
}

   <div class="vzwrap" id="vzWrap"><div class="vzbar">

    if(['html','markdown','text'].includes(fm.kind)) add('EDIT',()=>editProjectFile(fp,fm));
    add('FULL_SCREEN',()=>toggleFs(fb)); add('NEW_TAB',()=>openProjectFile(fm,fp)); if(fm.kind==='markdown'||fm.kind==='text') add('PDF',()=>exportPdf(fm,fp));
    add('SAVE',()=>downloadProjectFile(fm)); add('CLOSE_FILE',()=>{ st.file=null; showModule('visualizer'); },'go');
    fillFileBody($('.fvb',fb),fp,fm).then(fn=>{ fileCleanup=fn; });

  const onKey=e=>{
    if(rt.activeModule!=='visualizer'||!box.contains(cv)){ document.removeEventListener('keydown',onKey,true); return; }
    const tg=e.target; if(e.ctrlKey||e.metaKey||e.altKey||(tg&&(/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable))) return;

  };

  let raf=0, last=0;

    const mo=el('a','xbtn sm','OPEN_MEMORY_IN_OBSIDIAN'); mo.href=obsidianUrl(MEM_PATH); box.appendChild(mo);

    box.appendChild(el('div','mh',`<span>SEARCH_TEST</span><span>WHAT_THE_ASSISTANT_CAN_FIND</span>`));
    const sr=el('div','frow'); const si=el('input','in'); si.placeholder='Search the vault…'; const sb=el('button','xbtn','SEARCH'); sr.append(si,sb); box.appendChild(sr);
    const res=el('div','mlist'); box.appendChild(res);
    const go=()=>{ const q=si.value.trim(); if(!q) return; const rs=vaultSearch(q,8); res.innerHTML=rs.length?rs.map(({e,s})=>`<a class="mrow vres" href="${obsidianUrl(e.path)}"><span class="s">${Math.round(s)}</span><span class="n">${esc(e.path)}</span></a>`).join(''):'<div class="mnote">No matches.</div>'; };
    sb.onclick=go; si.onkeydown=e=>{ if(e.key==='Enter') go(); };
  }
};

VIEWS.devices=box=>{
  redraw=draw; draw(); if(db.devices.length) devicesRefreshAll();
  function draw(){
    box.innerHTML='';
    const n=db.devices.length, offline=db.devices.filter(d=>d.err).length;
    box.appendChild(el('div','mh',`<span>CONNECTIONS / ${n}_CONNECTED</span><span>${offline?offline+'_OFFLINE':n?'ALL_ONLINE':''}</span>`));
    if(devState.pair) box.appendChild(el('div','dpair',`<i></i><b>${esc(devState.pair.msg)}</b>`));
    if(devState.want) box.appendChild(el('div','dpair',`<i></i><b>PASTE_YOUR_${esc(snake(SERVICE_PRESETS[devState.want.preset].label))}_TOKEN_IN_THE_BOX_BELOW_AND_PRESS_CONNECT \u2014 THE_ASSISTANT_IS_WAITING</b>`));
    if(!n) box.appendChild(el('div','mnote','Connect your smart lights and gadgets, then just tell the assistant what you want — <b>"turn the living room lights to warm orange"</b>, <b>"dim everything to 20 percent"</b>, <b>"run the Relax scene"</b>. You can even say <b>"connect to my Hue lights"</b> and it will walk you through it. Everything talks straight to the device over your own Wi-Fi; no account and no cloud.'));
    if(db.reminders.length){ const rc=el('div','dcard'); rc.appendChild(el('div','dh',`<b>REMINDERS</b><span class="dip">${db.reminders.length}_SET</span>`)); db.reminders.slice().sort((a,b)=>a.at-b.at).forEach(r=>{ const row=el('div','frow'); row.appendChild(el('span','mnote',`${esc(new Date(r.at).toLocaleString())} \u2014 ${esc(r.text)}`)); const x=el('button','xbtn sm warn','CANCEL'); x.type='button'; x.onclick=()=>{ db.reminders=db.reminders.filter(y=>y.id!==r.id); changed(true); }; row.appendChild(x); rc.appendChild(row); }); box.appendChild(rc); }
    db.devices.forEach(d=>box.appendChild(d.kind==='hue'?hueCard(d):d.kind==='service'?serviceCard(d):httpCard(d)));
    box.appendChild(addServicePanel()); box.appendChild(addHuePanel()); box.appendChild(addHttpPanel());
  }
  const run=async(d,fn)=>{ try{ await fn(); d.err=''; }catch(e){ d.err=e.message; activity('Devices: '+e.message.slice(0,100),true); } changed(true); };
  function hueCard(d){
    const c=d.cache, card=el('div','dcard');
    card.appendChild(el('div','dh',`<b>${esc(d.name)}</b><span class="dip">HUE · ${esc(d.ip)}</span><span class="pill ${d.err?'bad':'cool'}">${d.err?'OFFLINE':'ONLINE'}</span>`));
    if(d.err) card.appendChild(el('div','derr',esc(d.err)));
    const bar=el('div','frow dbar');
    const mk=(t,fn,cls='')=>{ const b=el('button','xbtn sm '+cls,t); b.type='button'; b.onclick=fn; bar.appendChild(b); return b; };
    mk('REFRESH',()=>run(d,()=>hueRefresh(d)));
    mk('ALL_ON',()=>run(d,()=>lightsControl([d],{target:'all',on:true})),'go');
    mk('ALL_OFF',()=>run(d,()=>lightsControl([d],{target:'all',on:false})));
    mk('FLASH_ALL',()=>run(d,()=>lightsControl([d],{target:'all',alert:true})));
    const fg=mk('FORGET',()=>{},'warn'); armConfirm(fg,()=>{ db.devices=db.devices.filter(x=>x!==d); activity('Forgot '+d.name); changed(true); },'SURE?');
    card.appendChild(bar);
    if(!c){ card.appendChild(el('div','mnote','Loading lights…')); return card; }
    if(c.groups.length){
      card.appendChild(el('div','dsec','ROOMS'));
      c.groups.forEach(g=>{
        const row=el('div','drow'), on=g.on, pct=g.bri?Math.round(g.bri/2.54):50;
        row.appendChild(el('i','dsw ghost')); row.appendChild(el('span','dn',esc(g.name)+`<em>${g.lights.length} lights</em>`));
        const t=el('button','xbtn sm'+(on?' go':''),on?'ON':'OFF'); t.type='button'; t.onclick=()=>run(d,()=>hueSet(d,{kind:'group',id:g.id},{on:!on}).then(()=>hueRefresh(d))); row.appendChild(t);
        const s=el('input','sl'); s.type='range'; s.min=1; s.max=100; s.value=pct; s.style.setProperty('--p',pct+'%'); s.setAttribute('aria-label','Brightness for '+g.name);
        s.oninput=()=>s.style.setProperty('--p',s.value+'%'); s.onchange=()=>run(d,()=>hueSet(d,{kind:'group',id:g.id},hueState({brightness:+s.value})).then(()=>hueRefresh(d))); row.appendChild(s);
        const sc=c.scenes.filter(x=>String(x.group)===g.id);
        if(sc.length){ const w=el('div','dsc'); sc.slice(0,10).forEach(x=>{ const b=el('button','fchip',esc(x.name)); b.type='button'; b.title='Run the '+x.name+' scene in '+g.name; b.onclick=()=>run(d,()=>hueCall(d,'PUT',`/groups/${g.id}/action`,{scene:x.id}).then(()=>hueRefresh(d))); w.appendChild(b); }); row.appendChild(w); }
        card.appendChild(row);
      });
    }
    card.appendChild(el('div','dsec','LIGHTS'));
    c.lights.forEach(l=>{
      const row=el('div','drow'+(l.reachable?'':' dead')), pct=l.bri?Math.round(l.bri/2.54):0;
      const sw=el('i','dsw'); sw.style.background=l.on?(xyToCss(l.xy,l.bri)||'#ffd98a'):'transparent'; row.appendChild(sw);
      row.appendChild(el('span','dn',esc(l.name)+(l.reachable?'':'<em>UNREACHABLE</em>')));
      const t=el('button','xbtn sm'+(l.on?' go':''),l.on?'ON':'OFF'); t.type='button'; t.onclick=()=>run(d,()=>hueSet(d,{kind:'light',id:l.id},{on:!l.on}).then(()=>hueRefresh(d))); row.appendChild(t);
      const s=el('input','sl'); s.type='range'; s.min=1; s.max=100; s.value=pct||1; s.style.setProperty('--p',(pct||1)+'%'); s.setAttribute('aria-label','Brightness for '+l.name);
      s.oninput=()=>s.style.setProperty('--p',s.value+'%'); s.onchange=()=>run(d,()=>hueSet(d,{kind:'light',id:l.id},hueState({brightness:+s.value})).then(()=>hueRefresh(d))); row.appendChild(s);
      if(l.color){ const ci=el('input','dcol'); ci.type='color'; ci.value='#ffb060'; ci.title='Pick a color for '+l.name; ci.setAttribute('aria-label','Color for '+l.name); ci.onchange=()=>run(d,()=>hueSet(d,{kind:'light',id:l.id},hueState({color:ci.value})).then(()=>hueRefresh(d))); row.appendChild(ci); }
      card.appendChild(row);
    });
    return card;
  }
  function httpCard(d){
    const card=el('div','dcard');
    card.appendChild(el('div','dh',`<b>${esc(d.name)}</b><span class="dip">${esc(d.baseUrl.replace(/^https?:\/\//,''))}</span><span class="pill${d.err?' bad':' dim'}">${d.err?'ERROR':'CUSTOM'}</span>`));
    if(d.err) card.appendChild(el('div','derr',esc(d.err)));
    const needsVal=d.actions.some(a=>/\{\{\s*value\s*\}\}/.test(a.path+a.body));
    const bar=el('div','frow dbar'); let vi=null;
    if(needsVal){ vi=el('input','in sm'); vi.placeholder='value (for actions that use one)'; bar.appendChild(vi); }
    d.actions.forEach(a=>{ const b=el('button','xbtn sm',esc(a.name)); b.type='button'; b.title=`${a.method} ${a.path}`; b.onclick=()=>run(d,()=>httpAction(d,a.name,vi?vi.value:'')); bar.appendChild(b); });
    const fg=el('button','xbtn sm warn','FORGET'); fg.type='button'; armConfirm(fg,()=>{ db.devices=db.devices.filter(x=>x!==d); activity('Forgot '+d.name); changed(true); },'SURE?'); bar.appendChild(fg);
    card.appendChild(bar); return card;
  }
  function serviceCard(d){
    const card=el('div','dcard');
    card.appendChild(el('div','dh',`<b>${esc(d.name)}</b><span class="dip">${esc(d.account||d.baseUrl.replace(/^https:\/\//,''))}</span><span class="pill${d.err?' bad':' cool'}">${d.err?'PROBLEM':'CONNECTED'}</span>`));
    if(d.err) card.appendChild(el('div','derr',esc(d.err)));
    card.appendChild(el('div','mnote',`<b>CAN:</b> ${svcActions(d).map(a=>esc(paramSig(a))+(a.write?' ✎':'')).join(' · ')||'read-only requests'} · <b>ANYTHING_ELSE:</b> read-only GET`));
    const bar=el('div','frow dbar');
    const test=el('button','xbtn sm','TEST'); test.type='button'; test.onclick=async()=>{ try{ await verifyService(d); d.err=''; activity(d.name+' token works'); }catch(e){ d.err=e.message; } changed(true); };
    const fg=el('button','xbtn sm warn','FORGET'); fg.type='button'; armConfirm(fg,()=>{ db.devices=db.devices.filter(x=>x!==d); activity('Forgot '+d.name); changed(true); },'SURE?');
    bar.append(test,fg); card.appendChild(bar); return card;
  }
  function addServicePanel(){
    const w=el('div','dadd'); w.appendChild(el('div','mh','<span>CONNECT_AN_ONLINE_SERVICE</span><span>GITHUB · VERCEL · NETLIFY · ANY_API</span>'));
    const sel=el('select','in'); [['github','GitHub'],['vercel','Vercel'],['netlify','Netlify'],['notion','Notion'],['linear','Linear'],['homeassistant','Home Assistant'],['custom','Other (any web API)']].forEach(([v,l])=>sel.appendChild(new Option(l,v)));
    const hint=el('div','mnote'); const tok=el('input','in'); tok.type='password'; tok.autocomplete='off'; tok.placeholder='Paste the access token here (stays in this browser only)'; tok.maxLength=400;
    const team=el('input','in sm'); team.placeholder='Team ID (optional, for team projects)'; team.maxLength=60;
    const ha=el('input','in'); ha.placeholder='Home Assistant address, e.g. 192.168.1.30:8123'; ha.maxLength=80;
    const cn=el('input','in'); cn.placeholder='Name, e.g. Linear'; cn.maxLength=40;
    const cu=el('input','in'); cu.placeholder='API address, e.g. https://api.linear.app'; cu.maxLength=120;
    const cv=el('input','in sm'); cv.placeholder='Test path (optional), e.g. /me'; cv.maxLength=80;
    const ch=el('input','in sm'); ch.placeholder='Auth header (default Authorization)'; ch.maxLength=40;
    const cp=el('input','in sm'); cp.placeholder='Token prefix (default "Bearer ")'; cp.maxLength=20;
    const ca=el('textarea','in'); ca.rows=3; ca.spellcheck=false; ca.placeholder='Actions, one per line:  NAME METHOD /path | optional body\nme GET /me\nlist_items GET /items?limit={{count}}';
    const custom=el('div','dcustom'); custom.append(cn,cu,cv,ch,cp,ca);
    const go=el('button','xbtn go','CONNECT'); go.type='button'; const st=el('div','mnote dstatus');
    const sync=()=>{ const P=SERVICE_PRESETS[sel.value]; hint.innerHTML=P?esc(P.hint)+' <b>Use a token with only the access you want the assistant to have.</b>':'Any service that uses a token in a request header. Describe what it can do as actions; the assistant runs them by name. https addresses only.'; team.hidden=!(P&&P.team); ha.hidden=!(P&&P.local); custom.hidden=!!P; };
    sel.onchange=sync; sync();
    go.onclick=async()=>{ go.disabled=true; st.textContent='Checking the token…';
      try{ const d=await connectService({preset:sel.value,token:tok.value,team:team.value,name:cn.value,baseUrl:sel.value==='homeassistant'?ha.value:cu.value,verify:cv.value,authHeader:ch.value,authPrefix:cp.value===''?undefined:cp.value,actionsText:ca.value}); tok.value=''; st.textContent=`Connected: ${d.name}${d.account?' as '+d.account:''}`; }
      catch(e){ st.innerHTML=`<b>${esc(e.message)}</b>`; }
      go.disabled=false; };
    w.append(sel,hint,ha,tok,team,custom,go,st);
    if(devState.want){ sel.value=devState.want.preset; sync(); setTimeout(()=>{ try{ (ha.hidden?tok:ha).focus(); w.scrollIntoView({block:'center'}); }catch{} },80); }
    return w;
  }
  function addHuePanel(){
    const w=el('div','dadd'); w.appendChild(el('div','mh','<span>ADD_HUE_BRIDGE</span><span>PHILIPS_HUE</span>'));
    w.appendChild(el('div','mnote','Leave the address blank to search your network. Click <b>FIND_AND_PAIR</b>, then press the <b>round link button</b> on top of the bridge within 45 seconds. Your computer and the bridge must be on the same Wi-Fi.'));
    const r=el('div','frow'), ip=el('input','in'); ip.placeholder='Bridge IP address (optional), e.g. 192.168.1.20'; ip.maxLength=60;
    const go=el('button','xbtn go','FIND_AND_PAIR'); go.type='button'; r.append(ip,go); w.appendChild(r);
    const r2=el('div','frow'), key=el('input','in sm'); key.placeholder='Already have a bridge key? Paste it here (optional)'; key.maxLength=80; r2.appendChild(key); w.appendChild(r2);
    const st=el('div','mnote dstatus'); w.appendChild(st);
    go.onclick=async()=>{
      go.disabled=true; st.textContent='Working…';
      try{
        const res=await connectHue({ip:ip.value.trim()||undefined,key:key.value.trim()||undefined,onWaiting:()=>{ hudSet('LIGHTS','Press the round link button on your Hue bridge now',50000); }});
        st.textContent=res.already?'Already connected — refreshed.':`Connected: ${res.dev.name} · ${res.dev.cache.lights.length} lights`;
        ip.value=''; key.value='';
      }catch(e){ st.innerHTML=`<b>${esc(e.message)}</b>`; }
      go.disabled=false;
    };
    return w;
  }
  function addHttpPanel(){
    const w=el('div','dadd'); w.appendChild(el('div','mh','<span>ADD_ANY_DEVICE</span><span>LOCAL_WEB_API</span>'));
    w.appendChild(el('div','mnote','For anything else on your network that has a web (HTTP) address — WLED strips, Shelly or Tasmota plugs, a Home Assistant server, your own gadgets. Describe what it can do as actions and the assistant can run them by name. Use <b>{{value}}</b> where a number or word should go.'));
    const nm=el('input','in'); nm.placeholder='Name, e.g. Desk strip'; nm.maxLength=40;
    const url=el('input','in'); url.placeholder='Address, e.g. 192.168.1.50 (local network only)'; url.maxLength=80;
    const hd=el('textarea','in'); hd.rows=2; hd.placeholder='Headers (optional), one per line, e.g.\nAuthorization: Bearer abc123'; hd.spellcheck=false;
    const ac=el('textarea','in'); ac.rows=4; ac.spellcheck=false; ac.placeholder='Actions, one per line:  NAME METHOD /path | optional body\non POST /json/state | {"on":true}\noff POST /json/state | {"on":false}\nbrightness POST /json/state | {"bri":{{value}}}';
    const add=el('button','xbtn go','SAVE_DEVICE'); add.type='button'; const st=el('div','mnote dstatus');
    add.onclick=()=>{
      try{
        const name=nm.value.trim(); if(!name) throw new Error('Give it a name.');
        const actions=parseActions(ac.value); if(!actions.length) throw new Error('Add at least one action.');
        const host=cleanHost(url.value), scheme=/^https:/i.test(url.value.trim())?'https://':'http://';
        const d={id:uid(),kind:'http',name,baseUrl:scheme+host,headers:parseHeaders(hd.value),actions,added:Date.now()};
        db.devices=db.devices.filter(x=>!(x.kind==='http'&&norm(x.name)===norm(name))); db.devices.push(d);
        activity('Connected device '+name); changed(true);
      }catch(e){ st.innerHTML=`<b>${esc(e.message)}</b>`; }
    };
    w.append(nm,url,hd,ac,add,st); return w;
  }
};

function searchAll(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  const has=t=>String(t||'').toLowerCase().includes(q), out=[];
  db.projects.forEach(p=>{
    if(has(p.name)||has(p.key)||has(p.brief)) out.push({g:'PROJECTS',t:p.name,s:p.key+' · '+p.status,go:()=>{ ui.project=p.id; showModule('projects'); }});
    p.tasks.forEach(t=>{ if(has(t.title)||has(t.key)||has(t.result)) out.push({g:'TASKS',t:t.title,s:t.key+' · '+p.name,go:()=>{ ui.project=p.id; showModule('projects'); }}); });
    p.files.forEach(m=>{ if(has(m.name)) out.push({g:'FILES',t:m.name,s:p.name,go:()=>openProjectFile(m,p).catch(e=>activity('Could not open '+m.name+': '+e.message,true))}); });
    p.notes.forEach(n=>{ if(has(n.title)||has(n.text)) out.push({g:'NOTES',t:(n.title||n.text).slice(0,80),s:p.name,go:()=>{ ui.project=p.id; showModule('projects'); }}); });
  });
  db.ideas.forEach(i=>{ if(has(i.text)||has(i.key)) out.push({g:'IDEAS',t:i.text,s:i.key,go:()=>{ ui.idea=i.id; showModule('ideas'); }}); });
  db.agents.forEach(a=>{ if(has(a.name)||has(a.role)) out.push({g:'AGENTS',t:a.name,s:a.role,go:()=>{ ui.agent=a.id; showModule('agents'); }}); });
  return out.slice(0,40);
}
function openPalette(){
  if($('.pal')) return;
  const ov=el('div','lightbox pal');
  ov.innerHTML='<div class="palbox"><input class="palin" placeholder="SEARCH — projects, tasks, files, notes, ideas, agents" spellcheck="false" autocomplete="off"><div class="palres"></div><div class="palhint">↑↓ MOVE · ENTER OPEN · ESC CLOSE</div></div>';
  const inp=$('.palin',ov), res=$('.palres',ov); let hits=[], sel=0;
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',onKey,true); };
  const pick=i=>{ const h=hits[i]; if(!h) return; close(); h.go(); };
  const draw=()=>{
    res.innerHTML=''; let last='';
    if(!inp.value.trim()){ res.appendChild(el('div','palg','START TYPING')); return; }
    if(!hits.length){ res.appendChild(el('div','palg','NOTHING MATCHES')); return; }
    hits.forEach((h,i)=>{
      if(h.g!==last){ res.appendChild(el('div','palg',h.g)); last=h.g; }
      const r=el('button','palr'+(i===sel?' on':''),`<span>${esc(h.t)}</span><small>${esc(h.s)}</small>`); r.type='button';
      r.onclick=()=>pick(i); res.appendChild(r);
    });
    const on=$('.palr.on',res); if(on) on.scrollIntoView({block:'nearest'});
  };
  inp.oninput=()=>{ hits=searchAll(inp.value); sel=0; draw(); };
  const onKey=e=>{
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); close(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(hits.length-1,sel+1); draw(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(0,sel-1); draw(); }
    else if(e.key==='Enter'){ e.preventDefault(); pick(sel); }
  };
  document.addEventListener('keydown',onKey,true);
  ov.onclick=e=>{ if(e.target===ov) close(); };
  document.body.appendChild(ov); draw(); inp.focus();
}

/* =====================================================================
   ## SCREEN FIT + ANIMATION LOOP
   ===================================================================== */
/* On a normal window this fits exactly as before (scale to the tighter of width/height, canvas stays 1920 wide).
   On a wide monitor — or a window spanning several — height is the binding constraint and width has slack left
   over; instead of leaving that as empty bars on each side, the canvas itself grows to use it, so the middle
   column (which is already `1fr` in .main) shows more real content rather than just a bigger zoom. */
function fit(){
  const vw=innerWidth, vh=innerHeight;
  const small=vw<900&&!document.body.classList.contains('kiosk');
  document.body.classList.toggle('mobile',small);
  if(small){ SCALE=1; screenEl.style.width=''; screenEl.style.transform=''; screenEl.style.zoom=String(clamp(vw/900,.5,1)); return; }
  screenEl.style.zoom='';
  SCALE=Math.min(vw/1920,vh/1080);
  const wideOpen=vh/1080<vw/1920;
  const w=wideOpen?clamp(vw/SCALE,1920,2600):1920;
  screenEl.style.width=w+'px';
  screenEl.style.transform=`translate(-50%,-50%) scale(${SCALE})`;
}
window.addEventListener('resize',fit);

/* ---- audio visualizer: a mirrored spectrum that behaves differently for each thing the console can be doing ----
   speaking (neural voice) = the real output spectrum; listening = the real microphone spectrum;
   speaking (browser voice) = a spectrum shaped by the words as they are actually spoken (that engine exposes no audio);
   working = a scanner sweeping across; idle = a slow low breath. */
const VZ_N=40, VZ_PAL={idle:[[150,100,28],[224,146,31]],listen:[[46,140,160],[169,226,236]],work:[[255,120,50],[255,205,110]],speak:[[224,146,31],[255,224,150]]};
const wave=$('#wave'), wcv=document.createElement('canvas'); wave.appendChild(wcv);
const vz={ctx:wcv.getContext('2d'),v:new Float32Array(VZ_N),pk:new Float32Array(VZ_N),col:[[150,100,28],[224,146,31]],glow:0,last:0};
let sweepAnim=null;
function sweepPhase(now){   // where the STANDBY line's sweep is right now, read from the real CSS animation so the two can never drift apart
  try{
    if(!sweepAnim||sweepAnim.playState==='idle'){ const el0=document.querySelector('.sweep i'); sweepAnim=el0&&el0.getAnimations?el0.getAnimations()[0]||null:null; }
    if(sweepAnim&&sweepAnim.effect){ const d=sweepAnim.effect.getComputedTiming().duration||4500; return ((sweepAnim.currentTime||0)%d)/d; }
  }catch{}
  return (now%4500)/4500;
}
function vzSpec(fd,i){   // log-spaced bands over the speech range, interpolated between FFT bins, with a tilt because highs carry less energy
  const L=fd.length, hi=Math.max(6,Math.round(L*.34)), f=1+(hi-1)*Math.pow(i/(VZ_N-1),1.5), a=Math.floor(f), b=Math.min(L-1,a+1), k=f-a;
  return (fd[a]*(1-k)+fd[b]*k)/255*(.85+.9*i/(VZ_N-1));
}
function vzTarget(state,i,now,o){
  const x=i/(VZ_N-1);
  if(state==='speak'){
    if(o.spec) return clamp(vzSpec(o.spec,i)*.8*o.vcomp,0,1);
    const g=(c,w)=>Math.exp(-((x-c)*(x-c))/(2*w*w));
    const shape=.22+.85*g(.16+.08*Math.sin(now/870),.11)+.6*g(.42+.1*Math.sin(now/610+1.3),.13)+.32*g(.7+.08*Math.sin(now/470+2.1),.12);
    return clamp(o.env*shape*(.7+.3*Math.sin(now/(70+i*9)+i*1.9))*(.9+.4*rt.pulse)*.75,0,1);
  }
  if(state==='listen') return clamp(o.spec?vzSpec(o.spec,i)*1*(.55+rt.level*.7)+rt.level*.08:.05,0,1);
  if(state==='work'){ const pos=.5+.5*Math.sin(now/560); return .07+.8*Math.exp(-((x-pos)*(x-pos))/.007)+.14*Math.exp(-((x-(1-pos))*(x-(1-pos)))/.01)+.03*Math.sin(now/130+i); }
  // standby: the same low rolling wave as before, but its crest now travels at the STANDBY line's exact speed and position
  const c=-.2+1.4*(o.sweep||0);
  return Math.max(.04,.075+.06*Math.cos((x-c)/.4*Math.PI*2)+.03*Math.sin(now/260+i*1.3));
}
function vzDraw(want,now,o){
  const dt=Math.min(64,Math.max(1,now-(vz.last||now-16))); vz.last=now;
  // 1. which state we are IN: leaving one needs the change to persist for a beat (a gap between two sentences, a
  //    tool call finishing, a mic blip must not flip the whole display), while starting to speak is immediate
  if(!vz.state){ vz.state=want; vz.prev=want; vz.mix=1; vz.want=want; vz.wantAt=now; }
  if(want!==vz.want){ vz.want=want; vz.wantAt=now; }
  if(vz.want!==vz.state){
    const hold=vz.want==='speak'?0:vz.state==='speak'?420:vz.state==='work'?280:vz.state==='listen'?220:80;
    if(now-vz.wantAt>=hold){ vz.prev=vz.state; vz.state=vz.want; vz.mix=0; }
  }
  const state=vz.state;
  // 2. everything eases by elapsed time (not per frame), so it looks the same at 60 or 144 Hz and never snaps
  vz.mix=Math.min(1,vz.mix+dt/480); const e=vz.mix*vz.mix*(3-2*vz.mix);
  const dpr=window.devicePixelRatio||1, W=Math.max(1,Math.round(wave.offsetWidth*dpr*Math.max(SCALE,.5))), H=Math.max(1,Math.round(wave.offsetHeight*dpr*Math.max(SCALE,.5)));
  if(wcv.width!==W||wcv.height!==H){ wcv.width=W; wcv.height=H; }
  const c=vz.ctx, pal=VZ_PAL[state], kc=1-Math.exp(-dt/240);
  for(let j=0;j<2;j++) for(let m=0;m<3;m++) vz.col[j][m]+=(pal[j][m]-vz.col[j][m])*kc;
  const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`, base=rgb(vz.col[0]), hi=rgb(vz.col[1]);
  const ka=1-Math.exp(-dt/(vz.mix<1?70:48)), kr=1-Math.exp(-dt/(vz.mix<1?230:state==='idle'?90:170));
  for(let i=0;i<VZ_N;i++){
    let t=vzTarget(state,i,now,o);
    if(vz.mix<1&&vz.prev!==state) t=vzTarget(vz.prev,i,now,o)*(1-e)+t*e;   // crossfade between the old and new behaviour
    vz.v[i]+=(t-vz.v[i])*(t>vz.v[i]?ka:kr);
    vz.pk[i]=Math.max(vz.v[i],vz.pk[i]-.0004*dt);
  }
  vz.glow+=(((state==='speak'||state==='listen')?Math.min(1,o.lvl):state==='work'?.5:.15)-vz.glow)*(1-Math.exp(-dt/260));
  c.clearRect(0,0,W,H);
  const mid=H/2, step=W/VZ_N, bw=step*.62;
  if(vz.glow>.05){ const g=c.createRadialGradient(W/2,mid,0,W/2,mid,W*.5); g.addColorStop(0,`rgba(${vz.col[1][0]|0},${vz.col[1][1]|0},${vz.col[1][2]|0},${.16*vz.glow})`); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.fillRect(0,0,W,H); }
  c.strokeStyle=`rgba(${vz.col[1][0]|0},${vz.col[1][1]|0},${vz.col[1][2]|0},.22)`; c.lineWidth=Math.max(1,dpr); c.beginPath(); c.moveTo(0,mid); c.lineTo(W,mid); c.stroke();
  const grad=c.createLinearGradient(0,0,0,H); grad.addColorStop(0,base); grad.addColorStop(.5,hi); grad.addColorStop(1,base);
  c.fillStyle=grad; c.shadowColor=hi; c.shadowBlur=(4+12*vz.glow)*dpr;
  for(let i=0;i<VZ_N;i++){
    const h=Math.max(2*dpr,vz.v[i]*H*.7), x=step*i+(step-bw)/2;
    c.beginPath(); if(c.roundRect) c.roundRect(x,mid-h/2,bw,h,bw/2); else c.rect(x,mid-h/2,bw,h); c.fill();
  }
  c.shadowBlur=0; c.fillStyle=hi; c.globalAlpha=.75;
  for(let i=0;i<VZ_N;i++){ const ph=vz.pk[i]*H*.35, x=step*i+(step-bw)/2; if(ph>3*dpr){ c.fillRect(x,mid-ph-3*dpr,bw,1.6*dpr); c.fillRect(x,mid+ph+1.4*dpr,bw,1.6*dpr); } }
  c.globalAlpha=1;
}

/** where the browser voice is in the sentence right now (from its real word boundaries), as a 0-1 loudness shape:
    swells through each word, dips in the gaps between words, and lets go at the end of a clause */
function speechEnv(now){
  const s=rt.spk; if(!s) return 0;
  const txt=s.text, pos=s.calChar+((now-s.calT)/1000)*s.cps;
  if(pos>=txt.length) return .06;
  const i=Math.max(0,Math.floor(pos));
  if(/\s/.test(txt[i])) return .08;
  let a=i,b=i; while(a>0&&!/\s/.test(txt[a-1])) a--; while(b<txt.length&&!/\s/.test(txt[b])) b++;
  const frac=clamp((pos-a)/Math.max(1,b-a),0,1), len=b-a, amp=clamp(.5+len*.07,.55,1);
  let e=Math.pow(Math.sin(Math.PI*frac),.6);
  if(/[.,;:!?]$/.test(txt.slice(a,b))&&frac>.8) e*=Math.max(0,1-(frac-.8)*4);
  return .1+e*amp*.9;
}
function frame(t){
  requestAnimationFrame(frame);
  // the waveform canvas only exists on the Overview screen (#viewHome) -- every other module hides it with
  // `hidden`, but this loop used to keep computing the full spectral draw (gradients, per-bar easing, canvas
  // fill) 60+ times a second regardless, forever, in every open window. That's real, constant CPU/GPU work
  // for a picture nobody can see -- skip it all whenever the wave isn't actually on screen or the tab itself
  // is in the background (a second monitor window sitting on PROJECTS or DASHBOARD, a backgrounded tab, ...).
  if(document.hidden||rt.activeModule!=='overview') return;
  let lvl=0,spec=null;
  const micHot=rt.listening&&!rt.micPaused;
  if(micHot&&mic.an){
    mic.an.getByteTimeDomainData(mic.td); let s=0;
    for(let i=0;i<mic.td.length;i++){ const v=(mic.td[i]-128)/128; s+=v*v; }
    lvl=clamp(Math.sqrt(s/mic.td.length)*5,0,1);
    mic.an.getByteFrequencyData(mic.fd); spec=mic.fd;
  }
  rt.level+=(lvl-rt.level)*.4; rt.pulse*=.93;
  // "speaking" for the bars means audio is genuinely sounding right now — not merely queued
  const cloudLive=!!(cloud.cur&&cloud.an), brLive=rt.speakLive&&!!rt.spk, speaking=cloudLive||brLive, nowP=performance.now();
  let env=0, cspec=null;
  if(cloudLive){   // neural voices: the bars ARE the real audio (analyser on the output), compensated for the volume slider
    cloud.an.getByteFrequencyData(cloud.fd); cspec=cloud.fd;
  }else if(brLive) env=speechEnv(nowP);   // browser voices expose no audio, so follow the words as they are actually spoken
  const proc=(rt.requesting||db.runs.some(r=>r.status==='running')||remoteFlags().working)&&!speaking&&!micHot, vcomp=1/Math.max(.25,db.audio.out/100);
  const state=speaking?'speak':micHot?'listen':proc?'work':'idle';
  vzDraw(state,nowP,{sweep:sweepPhase(nowP),spec:cloudLive?cspec:(micHot&&!speaking?spec:null),env,vcomp,lvl:speaking?(cloudLive?clamp(Math.sqrt(cspec.reduce((q,v)=>q+v*v,0)/cspec.length)/110,0,1):env):rt.level});
  renderInterim();
}
